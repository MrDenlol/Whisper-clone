name: Windows Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (MSVC, Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWHISPERFLOW_BUILD_TESTS=ON

      - name: Build Project
        shell: pwsh
        run: |
          $buildLog = cmake --build build --config Release 2>&1 | ForEach-Object { $_ }
          if ($LASTEXITCODE -ne 0) {
            $errors = $buildLog | Where-Object {
              $_.Contains('Whisper-clone\src') -or $_ -match '(^|[^a-z])(error|fatal error)[ :]|LNK[0-9]{4}'
            }
            if ($errors) {
              $errors | Select-Object -First 100 | ForEach-Object { Write-Host "::error::$($_)" }
            } else {
              $buildLog | Select-Object -Last 100 | ForEach-Object { Write-Host "::error::$($_)" }
            }
            Write-Host "::error::Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem .\scripts\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($script.Name): $($_.Message)" }; exit 1 }
            Write-Host "$($script.Name) parses cleanly"
          }

      - name: Smoke test (no model installed -> exit code 3 with guidance)
        shell: pwsh
        run: |
          # The tray build is a Windows-subsystem executable, so PowerShell would
          # otherwise return before it exits. Start-Process -Wait keeps the check
          # deterministic.
          $exe = (Resolve-Path .\build\bin\WhisperFlowClone.exe)
          $proc = Start-Process -FilePath $exe -ArgumentList '--list-models' -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) { throw "--list-models exited with $($proc.ExitCode)" }

      - name: Assemble release folder (dist/)
        run: cmake --install build --config Release --prefix dist --component whisperflow

      - name: Verify dist/ layout (exe + runtime DLLs, no debug artefacts, no models)
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | ForEach-Object { Write-Host ("  {0,10:N0} KiB  {1}" -f ($_.Length / 1KB), $_.FullName.Substring((Resolve-Path dist).Path.Length + 1)) }
          foreach ($required in 'WhisperFlowClone.exe', 'msvcp140.dll', 'vcruntime140.dll', 'vcomp140.dll',
                                'settings.example.json', 'dictionary.json', 'LICENSE', 'LICENSES.md', 'NOTICE',
                                'README.md', 'scripts\download_model.ps1', 'models\README.txt') {
            if (-not (Test-Path (Join-Path dist $required))) { throw "dist is missing $required" }
          }
          $forbidden = Get-ChildItem dist -Recurse -File -Include *.pdb, *.ilk, *.lib, *.exp, *.obj, *.bin
          if ($forbidden) { $forbidden | ForEach-Object { Write-Host "::error::forbidden file in dist: $($_.FullName)" }; exit 1 }
          Write-Host "dist/ layout OK"

      - name: dist/ smoke test (runs from the release folder)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Resolve-Path .\dist\WhisperFlowClone.exe) -ArgumentList '--help' -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) { throw "dist\WhisperFlowClone.exe --help exited with $($proc.ExitCode)" }

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFlowClone-windows-x64
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux (GCC, CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWHISPERFLOW_BUILD_TESTS=ON

      - name: Build Project
        run: cmake --build build -j 4

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  license-audit:
    name: License audit (no copyleft)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Project license is MIT
        run: head -1 LICENSE | grep -q "MIT License"

      - name: No copyleft license text in the repository
        run: |
          # .github is excluded: this pattern itself contains the phrases it looks for.
          if grep -rIl -E "GNU GENERAL PUBLIC LICENSE|GNU LESSER GENERAL PUBLIC LICENSE|GNU AFFERO GENERAL PUBLIC LICENSE|Server Side Public License" . --exclude-dir=.git --exclude-dir=.github; then
            echo "Copyleft license text found - this project only allows MIT/BSD/Apache-2.0/Unlicense/CC0."
            exit 1
          fi
          echo "No copyleft license text found."

      - name: Pinned dependency is the one documented in LICENSES.md
        run: |
          grep -q "whisper.cpp/archive/refs/tags/v1.9.3.tar.gz" CMakeLists.txt
          grep -q "1650f884effba487025143bd8facd2f9fb40a83b3737a732803c67a8d659d9c0" CMakeLists.txt
          grep -q "whisper.cpp" LICENSES.md
          grep -q "ggml" LICENSES.md
          echo "Dependency pin matches LICENSES.md."

      - name: No build junk, secrets or user-specific absolute paths tracked in git
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(build|dist|out|models)/|\.(pdb|exe|dll|lib|obj|bin|zip)$'; then
            echo "Build output or binaries are tracked in git."; exit 1
          fi
          if git ls-files | grep -E '\.(env|pem|key|secret)$|(^|/)\.env'; then
            echo "Secret-looking files are tracked in git."; exit 1
          fi
          if git grep -nIE '[A-Za-z]:\\Users\\[A-Za-z0-9_.-]+\\|/home/[a-z0-9_-]+/|/Users/[A-Za-z0-9_.-]+/' -- ':!.github' | grep -vE 'C:\\Users\\(you|<you>)\\'; then
            echo "User-specific absolute path found - use %LOCALAPPDATA% / relative paths."; exit 1
          fi
          if git grep -nIiE '(api[_-]?key|secret[_-]?key|access[_-]?token|password)\s*[:=]\s*["'"'"'][^"'"'"']{8,}' -- ':!.github'; then
            echo "Hard-coded credential found."; exit 1
          fi
          echo "Tree is clean."
